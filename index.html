<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşiyan - Bizim Yuvamız</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121a16;
            --card-bg: #1a2620;
            --accent-green: #3b5d4a;
            --light-green: #5a8a70;
            --text-main: #e2e8e4;
            --text-muted: #94a39b;
            --border-color: #273830;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--light-green);
            font-size: 1rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content-box {
            margin-bottom: 30px;
            line-height: 1.6;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--light-green);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 93, 74, 0.4);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aşiyan</h1>
        <div class="subtitle">Kalbimizdeki Yuva</div>
        
        <div class="content-box">
            <p>Burası bizim huzur limanımız, geleceğimizin ilk tuğlası...</p>
        </div>

        <button class="btn" onclick="mesajGoster()">Bize Bir Not</button>
        
        <div id="dynamic-message" style="margin-top: 20px; color: var(--light-green); font-style: italic;"></div>
    </div>

    <footer>
        Geleceğe sevgiyle...
    </footer>

    <script src="script.js"></script>
</body>
</html>
