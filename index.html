<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşiyan - Bizim Hikayemiz</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff7f50;
            --dark-orange: #e86333;
            --light-orange: #fff4f0;
            --accent-orange: #ffb380;
            --text-dark: #4a3530;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-orange);
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
        }

        /* Disney Karakterleri Dekoratif Arka Plan Öğeleri */
        .disney-sticker {
            position: absolute;
            width: 80px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary-orange), var(--dark-orange));
            color: var(--white);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 25px rgba(255, 127, 80, 0.3);
            position: relative;
            z-index: 1;
        }

        header h1 { font-family: 'Sacramento', cursive; font-size: 4rem; margin-bottom: 5px; }
        header p { font-size: 1.1rem; font-weight: 300; }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(232, 99, 51, 0.08);
            border: 2px solid rgba(255, 179, 128, 0.3);
        }

        h2 { color: var(--dark-orange); margin-bottom: 15px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }

        /* 1. Sayaç Bölümü */
        #counter-box {
            text-align: center;
            background: linear-gradient(135deg, #fff0eb, #ffe4dc);
        }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .time-box {
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .time-box span { display: block; font-size: 1.8rem; font-weight: 700; color: var(--dark-orange); }
        .time-box label { font-size: 0.8rem; color: #775a50; }

        /* 2. Spotify Müzik Kutuları */
        .spotify-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media(max-width: 768px) { .spotify-grid { grid-template-columns: 1fr; } }
        .spotify-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-orange);
            border-radius: 8px;
            margin-bottom: 10px;
            outline: none;
        }
        iframe { width: 100%; height: 152px; border-radius: 12px; border: none; }

        /* 3. Checklist */
        .checklist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .checklist-grid { grid-template-columns: 1fr; } }
        .todo-input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .todo-input-group input { flex: 1; padding: 8px 12px; border: 1px solid var(--accent-orange); border-radius: 8px; }
        button {
            background: var(--primary-orange);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        button:hover { background: var(--dark-orange); }
        ul { list-style: none; }
        ul li { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }

        /* 4. Taş Kağıt Makas */
        .rps-arena { text-align: center; }
        .rps-btns { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        .rps-btn { font-size: 1.5rem; padding: 10px 20px; background: var(--light-orange); border: 2px solid var(--primary-orange); border-radius: 12px; cursor: pointer; }
        .rps-btn:hover { background: var(--accent-orange); }

        /* 5. Ruh Hali Barı */
        .mood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; }
        .mood-select { font-size: 1.2rem; padding: 8px; border-radius: 10px; border: 2px solid var(--primary-orange); width: 100%; margin-top: 5px; }

        /* 6. Gerçek Dönen Çark Alanı */
        .wheel-container { text-align: center; position: relative; }
        .wheel-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }
        #canvas-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--dark-orange);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1);
        }
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid var(--dark-orange);
            z-index: 10;
        }
        #wheel-result { font-size: 1.2rem; font-weight: 600; color: var(--dark-orange); margin-top: 15px; min-height: 30px; }

        /* 7. Zaman Kapsülü */
        .capsule-form { display: grid; gap: 10px; margin-bottom: 15px; }
